<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radmehr OS Web</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf4ff;font-family:Tahoma,Arial,sans-serif}.os{min-height:100vh;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0e2038;border:1px solid #1e4169;border-radius:18px;padding:14px 18px}.brand{font-weight:800;font-size:22px}.ver{opacity:.7}.hero{margin:18px 0;background:linear-gradient(135deg,#112b4b,#102039);padding:22px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.app{border:1px solid #254d79;background:#10233c;color:#fff;padding:18px;border-radius:18px;cursor:pointer;font-size:16px}.app:hover{transform:translateY(-2px);background:#153052}.terminal{margin-top:16px;background:#02070d;border-radius:16px;padding:16px;min-height:210px;white-space:pre-wrap;direction:ltr;text-align:left;font-family:monospace}.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;padding:12px;border-radius:12px;border:1px solid #31577e;background:#09182a;color:#fff}.row button{padding:12px 18px;border:0;border-radius:12px;cursor:pointer}.hidden{display:none}
</style></head><body><main class="os"><div class="top"><div class="brand">🚀 Radmehr OS Web</div><div class="ver">v1 Web</div></div>
<section class="hero"><h2 id="welcome">سلام! به Radmehr OS خوش اومدی 👋</h2><p>نسخه وب برای اجرا مستقیم داخل مرورگر.</p></section>
<div class="grid">
<button class="app" onclick="openApp('games')">🎮 Games</button><button class="app" onclick="openApp('ai')">🤖 AI</button><button class="app" onclick="openApp('space')">🪐 Space</button><button class="app" onclick="openApp('tools')">🧰 Tools</button><button class="app" onclick="openApp('settings')">⚙️ Settings</button>
</div>
<div id="terminal" class="terminal">Radmehr OS Web ready.
Choose an app above.</div>
<div class="row"><input id="cmd" placeholder="help را بنویس..." autocomplete="off"><button onclick="runCmd()">اجرا</button></div>
</main><script>
const term=document.getElementById('terminal'),cmd=document.getElementById('cmd');
let name=localStorage.getItem('radmehr_os_name')||'';
if(name) document.getElementById('welcome').textContent='سلام '+name+'! 👋';
function print(s){term.textContent+='\n'+s;term.scrollTop=term.scrollHeight}
function openApp(x){const m={games:'🎮 Games: بازی‌های نسخه وب به‌زودی اینجا اضافه می‌شوند.',ai:'🤖 AI: دستیار هوشمند نسخه وب.',space:'🪐 Space: بخش فضا و دانستنی‌ها.',tools:'🧰 Tools: ابزارهای Radmehr OS.',settings:'⚙️ Settings: برای ثبت نام بنویس: name رادمهر'};print(m[x])}
function runCmd(){let v=cmd.value.trim();cmd.value='';if(!v)return;print('> '+v);if(v==='help')print('commands: help, clear, about, name YOUR_NAME');else if(v==='clear')term.textContent='';else if(v==='about')print('Radmehr OS Web — browser edition');else if(v.startsWith('name ')){name=v.slice(5).trim();localStorage.setItem('radmehr_os_name',name);document.getElementById('welcome').textContent='سلام '+name+'! 👋';print('Saved name: '+name)}else print('Unknown command. Type help.')}
cmd.addEventListener('keydown',e=>{if(e.key==='Enter')runCmd()});
</script></body></html>
