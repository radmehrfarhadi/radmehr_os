name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'radmehr_os/**'
      - 'android_modules/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool libssl-dev \
            make openjdk-17-jdk patch pkg-config unzip wget zip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # Buildozer's first run installs Android SDK components and asks
          # interactively for the Android SDK license. Feed "yes" only to
          # Buildozer and disable pipefail so yes exiting after EOF cannot
          # turn an otherwise successful build into a failed step.
          set +o pipefail
          yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radmehr-os-apk
          path: bin/*.apk
          if-no-files-found: error
