name: Build Radmehr OS for macOS

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r radmehr_os/requirements.txt
          pip install pyinstaller pillow

      - name: Create version file
        run: |
          printf "1.0" > radmehr_os/version.txt

      - name: Build CLI runtime
        run: |
          pyinstaller --onedir --name radmehr_os radmehr_os/radmehr_os.py

      - name: Create macOS icon
        run: |
          python - <<'PY'
          from PIL import Image
          img = Image.open("radmehr_os_logo.ico")
          img.seek(getattr(img, "n_frames", 1) - 1)
          img = img.convert("RGBA")
          img.thumbnail((1024, 1024))
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          x = (1024 - img.width) // 2
          y = (1024 - img.height) // 2
          canvas.paste(img, (x, y), img)
          canvas.save("radmehr_os_logo.png")
          PY
          mkdir -p AppIcon.iconset
          sips -z 16 16 radmehr_os_logo.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 radmehr_os_logo.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 radmehr_os_logo.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 radmehr_os_logo.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 radmehr_os_logo.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 radmehr_os_logo.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 radmehr_os_logo.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 radmehr_os_logo.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 radmehr_os_logo.png --out AppIcon.iconset/icon_512x512.png
          cp radmehr_os_logo.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Create Radmehr OS app bundle
        run: |
          APP="dist/Radmehr OS.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/runtime"
          mkdir -p "$APP/Contents/Resources/radmehr_os"
          mkdir -p "$APP/Contents/Resources/runtime/data"

          cp -R dist/radmehr_os/. "$APP/Contents/Resources/runtime/"
          cp radmehr_os/version.txt "$APP/Contents/Resources/radmehr_os/version.txt"
          cp radmehr_os/password.hash "$APP/Contents/Resources/runtime/data/password.hash"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Radmehr OS</string>
            <key>CFBundleDisplayName</key>
            <string>Radmehr OS</string>
            <key>CFBundleIdentifier</key>
            <string>ir.radmehr-farhadi.radmehr-os</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleExecutable</key>
            <string>launcher</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          PLIST

          cat > "$APP/Contents/MacOS/launcher" <<'SH'
          #!/bin/bash
          APP_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          RESOURCES="$APP_DIR/Resources"
          RUNTIME="$RESOURCES/runtime"
          CMD="cd $(printf '%q' "$RESOURCES") && $(printf '%q' "$RUNTIME/radmehr_os")"
          /usr/bin/osascript \
            -e 'tell application "Terminal"' \
            -e 'activate' \
            -e "do script \"$CMD\"" \
            -e 'end tell'
          SH

          chmod +x "$APP/Contents/MacOS/launcher"
          chmod +x "$APP/Contents/Resources/runtime/radmehr_os"

      - name: Package macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Radmehr OS.app" "Radmehr-OS-v1.0-macOS.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: RadmehrOS-macOS
          path: dist/Radmehr-OS-v1.0-macOS.zip
