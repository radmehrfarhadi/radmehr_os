
name: Build Radmehr OS for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r radmehr_os/requirements.txt
          pip install pyinstaller pillow

      - name: Create version file
        run: |
          Set-Content -Path radmehr_os/version.txt -Value "1.0" -NoNewline

      - name: Build Radmehr OS
        run: |
          pyinstaller --onedir --name radmehr_os --icon=radmehr_os_logo.ico radmehr_os/radmehr_os.py

      - name: Add Radmehr OS data files
        run: |
          New-Item -ItemType Directory -Force -Path dist/radmehr_os/radmehr_os
          Copy-Item radmehr_os/version.txt dist/radmehr_os/radmehr_os/version.txt
          Copy-Item radmehr_os/password.hash dist/radmehr_os/radmehr_os/password.hash
          attrib +h dist\radmehr_os\radmehr_os\password.hash

      - name: Remove private runtime files
        run: |
          $privateFiles = @(
            "name_radmehr_os.txt",
            "api_key_radmehr_os.txt",
            "nasa_api_key.txt",
            ".env",
            "last_backup.txt",
            "request.txt",
            "admin.txt"
          )
          Get-ChildItem -Path dist/radmehr_os -Recurse -Force -File | Where-Object {
            $privateFiles -contains $_.Name
          } | Remove-Item -Force

      - name: Verify clean Windows build
        run: |
          $privateFiles = @(
            "name_radmehr_os.txt",
            "api_key_radmehr_os.txt",
            "nasa_api_key.txt",
            ".env",
            "last_backup.txt",
            "request.txt",
            "admin.txt"
          )
          $found = Get-ChildItem -Path dist/radmehr_os -Recurse -Force -File | Where-Object {
            $privateFiles -contains $_.Name
          }
          if ($found) {
            $found | ForEach-Object { Write-Host "Private file found: $($_.FullName)" }
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RadmehrOS-Windows
          path: dist/radmehr_os/
