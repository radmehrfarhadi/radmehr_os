
name: Build Radmehr OS for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r radmehr_os/requirements.txt
          pip install pyinstaller pillow

      - name: Create version file
        run: |
          Set-Content -Path radmehr_os/version.txt -Value "0.5" -NoNewline

      - name: Build Radmehr OS
        run: |
          pyinstaller --onedir --name RadmehrOS --icon=radmehr_os_logo.ico --collect-all bcrypt radmehr_os/radmehr_os.py

      - name: Add Radmehr OS data files
        run: |
          New-Item -ItemType Directory -Force -Path dist/RadmehrOS/radmehr_os
          Copy-Item radmehr_os/version.txt dist/RadmehrOS/radmehr_os/version.txt
          Copy-Item radmehr_os/password.hash dist/RadmehrOS/radmehr_os/password.hash
          attrib +h dist\RadmehrOS\radmehr_os\password.hash

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RadmehrOS-Windows
          path: dist/RadmehrOS/
